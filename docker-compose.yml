services:
  app:
    build: .
    image: registrador-eventos:dev
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      - db
    environment:
      CI_ENVIRONMENT: development

  db:
    image: docker.io/library/mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: registrador
      MARIADB_DATABASE: registrador
      MARIADB_USER: registrador
      MARIADB_PASSWORD: registrador
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

  mailpit:
    image: docker.io/axllent/mailpit:v1.21
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  dbdata:
